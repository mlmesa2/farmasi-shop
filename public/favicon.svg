<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo -->
  <rect width="100" height="100" rx="20" fill="#b3717b"/>
  
  <!-- Labio superior -->
  <path id="lip" d="M20 50 
           Q35 30, 50 40 
           Q65 30, 80 50 
           Q65 45, 50 48 
           Q35 45, 20 50 Z" 
        fill="#652d36"/>
  
  <!-- Labio inferior (misma forma invertida) -->
  <use href="#lip" transform="rotate(180 50 50)" fill="#652d36"/>
</svg>
